name: release

# Publishes only from a version tag, and only after a person approves the "release" environment.
#   ts-v<semver>  ->  @pokewallet/sdk on npm (with provenance)
#   py-v<semver>  ->  pokewallet on PyPI (Trusted Publishing, no stored token)
# The MCP package is private and is never published.
#
# Each package has two jobs. "verify" runs first, needs no approval, and builds the artifact
# that will be published; "publish" waits for the reviewer, then ships exactly that artifact.
on:
  push:
    tags:
      - 'ts-v[0-9]+.[0-9]+.[0-9]+*'
      - 'py-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify-npm:
    if: startsWith(github.ref_name, 'ts-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The tag version must match package.json and the VERSION constant
        working-directory: .
        run: python3 .github/scripts/check_release_version.py ts "${GITHUB_REF_NAME#ts-v}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack the tarball to publish
        run: |
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: verify-npm
    runs-on: ubuntu-latest
    environment: release # required reviewers are configured on this environment
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist
      - name: Publish
        run: npm publish ./dist/*.tgz --provenance --access public
        env:
          # Empty once the package has an npm trusted publisher; set the NPM_TOKEN environment
          # secret (a granular read-and-write token for @pokewallet) for the very first publish, before the package exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: The tag version must match pyproject.toml and the VERSION constant
        working-directory: .
        run: python3 .github/scripts/check_release_version.py py "${GITHUB_REF_NAME#py-v}"
      - name: Unit tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/unit
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build -o dist .
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: packages/py/dist/*
          if-no-files-found: error

  publish-pypi:
    needs: verify-pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
