name: drift

# Weekly check that the SDKs still match the live API. It needs a repository secret named
# POKEWALLET_API_KEY (a dedicated key); without it every step is skipped and the run succeeds.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
    steps:
      - name: Check for the API key secret
        id: key
        run: |
          if [ -n "$POKEWALLET_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "POKEWALLET_API_KEY is not set: skipping the contract tests."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: '3.12'
      - name: TypeScript contract tests
        if: steps.key.outputs.present == 'true'
        working-directory: packages/ts
        run: |
          npm ci
          npm run test:contract
      - name: Python contract tests
        if: steps.key.outputs.present == 'true'
        working-directory: packages/py
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/contract
